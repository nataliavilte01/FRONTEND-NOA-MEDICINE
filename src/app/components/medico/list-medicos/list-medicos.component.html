<div class="container container-medicos">
  <h1>Lista de médicos</h1>

  <button mat-flat-button (click)="openDialog('0ms','0ms', '0')" class="button-register"> Registrar Medico</button>

  <table mat-table [dataSource]="medicos" class="mat-elevation-z8">

    <ng-container matColumnDef="nombre_apellido">
      <th mat-header-cell *matHeaderCellDef>Apellido y Nombre </th>
      <td mat-cell *matCellDef="let element"> {{element.apellido}}, {{element.nombre}}  </td>
    </ng-container>

    <ng-container matColumnDef="dni">
      <th mat-header-cell *matHeaderCellDef> DNI </th>
      <td mat-cell *matCellDef="let element"> {{element.dni}} </td>
    </ng-container>
    <ng-container matColumnDef="fecha_nac">
      <th mat-header-cell *matHeaderCellDef> Fecha de Nacimiento </th>
      <td mat-cell *matCellDef="let element"> {{element.fecha_nac | date:'dd/MM/yyyy'}} </td>
    </ng-container>
    <ng-container matColumnDef="telefono">
      <th mat-header-cell *matHeaderCellDef> Telefono </th>
      <td mat-cell *matCellDef="let element"> {{element.telefono}} </td>
    </ng-container>
    <ng-container matColumnDef="direccion">
      <th mat-header-cell *matHeaderCellDef> Direccion </th>
      <td mat-cell *matCellDef="let element"> {{element.direccion}} </td>
    </ng-container>
    <ng-container matColumnDef="especialidad">
      <th mat-header-cell *matHeaderCellDef>Especialidad </th>
      <td mat-cell *matCellDef="let element"> {{element.especialidad_medica}} </td>
    </ng-container>
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones </th>
      <td mat-cell *matCellDef="let element">
        <button mat-mini-fab class="button-edit" (click)="openDialog('0ms', '0ms', element._id)"><mat-icon>edit</mat-icon></button>
        <button mat-mini-fab class="button-delete" (click)="deleteMedico(element._id)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

</div>
